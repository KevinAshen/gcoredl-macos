name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build macOS binaries
        run: VERSION="${GITHUB_REF_NAME#v}" ./dist.sh

      - name: Create checksums
        run: |
          cd dist
          shasum -a 256 gcoredl-darwin-amd64 gcoredl-darwin-arm64 > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/gcoredl-darwin-amd64 \
            dist/gcoredl-darwin-arm64 \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "gcoredl $GITHUB_REF_NAME"
